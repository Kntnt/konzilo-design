<!doctype html>
<html lang="en" data-kn-mode="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Konzilo Design Tool</title>
    <style id="kn-live-core">@layer kn-core, kn-base, kn-components;</style>
    <link rel="stylesheet" href="/src/fonts/fonts.css" />
    <link rel="stylesheet" href="/tool/components.css" />
    <link rel="stylesheet" href="/tool/style.css" />
  </head>
  <body data-kn-surface="page">
    <div id="tool" data-where="pane">
      <div class="controls">
        <nav class="menu" aria-label="Pages">
          <div class="menu-row">
            <span class="menu-pages" id="chapters"></span>
            <span class="menu-end">
              <span class="segments history">
                <button id="undo" type="button" aria-label="Undo" aria-keyshortcuts="Control+Z Meta+Z" disabled><svg width="0.875rem" height="0.875rem" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 2 1.5 5l3 3"/><path d="M1.5 5h7a3.5 3.5 0 0 1 0 7H5"/></svg></button>
                <button id="redo" type="button" aria-label="Redo" aria-keyshortcuts="Control+Shift+Z Meta+Shift+Z Control+Y" disabled><svg width="0.875rem" height="0.875rem" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 2l3 3-3 3"/><path d="M12.5 5h-7a3.5 3.5 0 0 0 0 7H9"/></svg></button>
              </span>
              <span id="status" role="status" aria-live="polite"><i></i><span id="status-text">Loading</span></span>
              <span class="segments" data-theme-control></span>
            </span>
          </div>
          <div class="menu-row">
            <span class="menu-pages" id="pages"></span>
            <span class="menu-end">
              <button id="bring-back" class="plain" type="button" hidden>Bring back</button>
              <button id="design-md" class="plain" type="button">Export for AI</button>
              <button id="presentation" class="primary" type="button">Create presentation</button>
            </span>
          </div>
        </nav>
        <div id="notice" role="status" aria-live="polite" hidden></div>
        <main id="document"><form id="form" aria-label="Design settings"></form></main>
      </div>
      <button id="divider" type="button" aria-label="Share the width between the controls and the preview"></button>
      <span id="optimal-line" hidden></span>
      <output id="divider-width" hidden></output>
      <section id="preview-pane" data-view="both" aria-label="Preview">
        <header class="preview-bar">
          <span class="segments" id="views"></span>
          <span class="preview-end">
            <span class="segments" id="picture-control"></span>
            <span class="segments" data-theme-control data-away-only></span>
            <button id="own-window" class="plain" type="button">Own window</button>
            <button id="full-window" class="plain" type="button">Full window</button>
          </span>
        </header>
        <div class="preview-ends">
          <section class="end" data-end="narrow" aria-label="Mobile preview">
            <header class="end-bar">
              <span class="end-dot"></span><b>Mobile</b><span class="figures">390 px</span>
              <output class="figures" data-end-sizes></output><span class="end-follows"></span>
            </header>
            <div class="view" id="view-narrow"><div class="frame-host">
              <iframe id="preview-narrow" title="Live preview at mobile width" src="/preview.html"></iframe>
            </div></div>
          </section>
          <section class="end" data-end="wide" aria-label="Desktop preview">
            <header class="end-bar">
              <span class="end-dot"></span><b>Desktop</b>
              <span class="choice small"><select id="desktop-width" aria-label="Width of the desktop window">
                <option value="1440">1440 px</option><option value="1024">1024 px</option><option value="768">768 px</option>
              </select></span>
              <button id="fit" class="figures" type="button"></button>
              <output class="figures end-sizes-wide" data-end-sizes></output><span class="end-follows"></span>
            </header>
            <div class="view" id="view-wide"><div class="frame-host">
              <iframe id="preview" title="Live preview at desktop width" src="/preview.html"></iframe>
            </div></div>
          </section>
        </div>
      </section>
    </div>
    <script type="module" src="/tool/app.js"></script>
  </body>
</html>
